name: Check the content

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the content checker's dependency
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate every lesson and exercise
        run: python scripts/check_content.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Compile every lesson's math with KaTeX
        run: node scripts/check_math.mjs

      - run: npm run build
        working-directory: frontend
